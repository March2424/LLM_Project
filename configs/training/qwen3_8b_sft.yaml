# Single 48GB GPU starting point. Run preflight before training; no dev/API evaluation.
model_name_or_path: /root/autodl-tmp/Qwen3-8B
trust_remote_code: false
stage: sft
do_train: true
finetuning_type: lora
lora_rank: 16
lora_alpha: 32
lora_dropout: 0.05
lora_target: all
dataset_dir: outputs/selector_training/data
dataset: selector_sft_train
template: qwen3_nothink
