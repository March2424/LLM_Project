name: Data import checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.11'
      - name: Install offline test dependencies
        run: python -m pip install -r configs/requirements-naev.txt -r configs/requirements-shattered.txt -r configs/requirements-retrieval.txt -r configs/requirements-workflow.txt
      - name: Run offline tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
