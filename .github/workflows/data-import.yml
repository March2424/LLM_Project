name: Data import checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.11'
      - name: Run standard-library data tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
