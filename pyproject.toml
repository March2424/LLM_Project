[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "game-localization-agent"
version = "0.1.0"
requires-python = ">=3.11"
description = "Game localization memory, retrieval and LangGraph review workflow"

[project.optional-dependencies]
workflow = ["langgraph==1.2.19", "langgraph-checkpoint-sqlite==3.1.3", "tokenizers==0.22.1", "python-dotenv==1.2.4"]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
localization-workflow = "localization_agent.workflow.cli:main"
